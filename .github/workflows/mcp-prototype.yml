name: MCP Prototype CI

on:
  push:
    branches: [mcp-prototype]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 9.5.0
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-9.5.0/bin/gradle --version
      - name: Build debug APK
        working-directory: mcp-prototype/android
        run: /tmp/gradle-9.5.0/bin/gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: via-mcp-bridge-debug
          path: mcp-prototype/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
